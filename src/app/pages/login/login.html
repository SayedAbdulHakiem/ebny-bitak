<section class="auth-layout">
  <form class="panel auth-card" (submit)="$event.preventDefault(); submit()">
    <h1> تسجيل الدخول للبائعين</h1>

    <label>
      البريد الإلكتروني
      <input type="email" [value]="email()" (input)="setEmail($event)" autocomplete="username" required />
    </label>
    <label>
      كلمة المرور
      <input type="password" [value]="password()" (input)="setPassword($event)" autocomplete="current-password" required />
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button class="button" type="submit" [disabled]="busy()">{{ busy() ? 'جارٍ الدخول…' : 'دخول' }}</button>
    <a routerLink="/">العودة للبحث</a>
  </form>
</section>
