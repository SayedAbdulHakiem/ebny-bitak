<form class="date-range" (submit)="submit($event)">
  <label>
    {{ text.dates.from }}
    <input type="date" [value]="from()" (input)="setFrom($event)" required />
  </label>
  <label>
    {{ text.dates.to }}
    <input type="date" [value]="to()" (input)="setTo($event)" required />
  </label>
  <button type="submit" class="button secondary">{{ text.dates.apply }}</button>
</form>
